<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-label="FIT CLI demo: one registry, five surfaces">
  <title>FIT — one registry, five surfaces</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#121a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <style>
      text { font-family: "SFMono-Regular", ui-monospace, "Cascadia Code", Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
      .ln { opacity: 0; animation: fade .18s ease-out forwards; }
      @keyframes fade { to { opacity: 1; } }
      .cursor { opacity: 0; animation: blink 1.05s steps(1) infinite; animation-delay: 7.07s; }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      .pulse { animation: pulse 6s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="480" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="899" height="479" rx="14" fill="none" stroke="#1f2a44"/>
  <rect x="0" y="0" width="900" height="4" fill="url(#accent)"/>

  <circle cx="28" cy="30" r="6" fill="#ef4444" opacity=".85"/>
  <circle cx="50" cy="30" r="6" fill="#f59e0b" opacity=".85"/>
  <circle cx="72" cy="30" r="6" fill="#22c55e" opacity=".85"/>
  <text x="450" y="35" text-anchor="middle" fill="#7c8db5" font-size="12">fit — one registry · five surfaces</text>

  <g class="ln" style="animation-delay:0.35s"><text x="34" y="78" fill="#e2e8f0" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan>fit init</text></g>
  <g class="ln" style="animation-delay:0.77s"><text x="34" y="101" fill="#64748b" xml:space="preserve">initialised &lt;demo-root&gt;/registry/fit.json</text></g>
  <g class="ln" style="animation-delay:1.19s"><text x="34" y="124" fill="#e2e8f0" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan>fit register env node --command node</text></g>
  <g class="ln" style="animation-delay:1.61s"><text x="34" y="147" fill="#64748b" xml:space="preserve">registered env/node</text></g>
  <g class="ln" style="animation-delay:2.03s"><text x="34" y="170" fill="#e2e8f0" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan>fit register mcp fit-hub --command node --args bin/fit.mjs,serve,mcp</text></g>
  <g class="ln" style="animation-delay:2.45s"><text x="34" y="193" fill="#64748b" xml:space="preserve">registered mcp/fit-hub</text></g>
  <g class="ln" style="animation-delay:2.87s"><text x="34" y="216" fill="#e2e8f0" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan>fit list</text></g>
  <g class="ln" style="animation-delay:3.29s"><text x="34" y="239" fill="#94a3b8" xml:space="preserve">kind  name     transport  target                                          description</text></g>
  <g class="ln" style="animation-delay:3.71s"><text x="34" y="262" fill="#94a3b8" xml:space="preserve">----  -------  ---------  ----------------------------------------------  -----------</text></g>
  <g class="ln" style="animation-delay:4.13s"><text x="34" y="285" fill="#94a3b8" xml:space="preserve">env   node     local      node</text></g>
  <g class="ln" style="animation-delay:4.55s"><text x="34" y="308" fill="#94a3b8" xml:space="preserve">mcp   fit-hub  stdio      /opt/hostedtoolcache/node/20.20.2/x64/bin/node</text></g>
  <g class="ln" style="animation-delay:4.97s"><text x="34" y="331" fill="#e2e8f0" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan>fit probe fit-hub</text></g>
  <g class="ln" style="animation-delay:5.39s"><text x="34" y="354" fill="#34d399" xml:space="preserve">mcp/fit-hub: OK</text></g>
  <g class="ln" style="animation-delay:5.81s"><text x="34" y="377" fill="#94a3b8" xml:space="preserve">tools  fit_list, fit_resolve, fit_register, …</text></g>
  <g class="ln" style="animation-delay:6.23s"><text x="34" y="400" fill="#e2e8f0" xml:space="preserve"><tspan fill="#22d3ee">$ </tspan>fit serve mcp   # 2 endpoints reachable over MCP</text></g>
  <g class="ln" style="animation-delay:6.65s"><text x="34" y="423" fill="#34d399" xml:space="preserve">agent connected · registered as example-client</text></g>

  <rect class="cursor" x="34" y="428" width="8" height="15" fill="#22d3ee" rx="1"/>
  <text class="pulse" x="876" y="468" text-anchor="end" fill="#475569" font-size="10.5">generated by GitHub Actions from real CLI output</text>
</svg>

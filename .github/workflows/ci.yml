name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Report versions
        run: |
          node --version
          python3 --version || true
      - name: End-to-end smoke test (CLI, MCP, HTTP/A2A, SDKs)
        run: npm test

      - name: README gate (bilingual coverage, links, images, placeholders)
        run: node tools/check-readme.mjs README.md
